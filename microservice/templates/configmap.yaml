apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "microservice.name" . }}-envvars
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
data:
  APP_ENVIRONMENT: {{ .Values.environment | quote }}
  {{- range $key, $value := .Values.envvars }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
