{{- if .Values.secrets.enabled }}
# Le pide a External Secrets que copie el secreto JSON de Secrets Manager
# (secrets.remoteKey) a un Secret de Kubernetes llamado <app>-secrets.
# Cada clave del JSON se convierte en una clave del Secret.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "microservice.name" . }}
  labels:
    {{- include "microservice.labels" . | nindent 4 }}
  annotations:
    # Argo CD lo crea ANTES que el Deployment (wave -1 < wave 0) y espera a
    # que esté "Healthy" (secreto sincronizado) antes de seguir.
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.secrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ required "secrets.secretStoreName es obligatorio cuando secrets.enabled=true" .Values.secrets.secretStoreName }}
  target:
    name: {{ include "microservice.name" . }}-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ required "secrets.remoteKey es obligatorio cuando secrets.enabled=true" .Values.secrets.remoteKey }}
{{- end }}
